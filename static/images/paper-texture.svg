<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <!-- Directional noise — paper fibers run horizontally -->
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.2" numOctaves="4" result="noise"/>
      <!-- Soften and tint to warm grey, low alpha -->
      <feColorMatrix type="matrix" values="
        0.5 0.3 0.1 0 0
        0.5 0.3 0.1 0 0
        0.5 0.3 0.1 0 0
        0   0   0   0.07 0" in="noise" result="grain"/>
      <!-- Slight blur to remove harsh pixel noise -->
      <feGaussianBlur stdDeviation="0.5" in="grain" result="soft"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="transparent" filter="url(#paper)"/>
</svg>